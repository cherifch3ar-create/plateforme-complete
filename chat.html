<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messagerie — Mail Pro Company</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#f97316" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    try { const s=localStorage.getItem('theme'); if (s==='dark'||(!s&&matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); } catch(e){}
    tailwind.config = { darkMode:'class', theme:{ extend:{
      fontFamily:{ sans:['Inter','system-ui','sans-serif'] },
      colors:{ orange:{50:'#fff5ed',100:'#ffe8d4',400:'#ff7d36',500:'#f97316',600:'#ea580c',700:'#c2410c'} }
    }}}
  </script>
</head>
<body class="h-full font-sans bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100">
  <div id="boot" style="position:fixed;inset:0;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:99999;font-family:system-ui,-apple-system,sans-serif">
    <div style="width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,#ff8a3d,#ea580c);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(234,88,12,.35)">
      <svg width="42" height="42" viewBox="0 0 128 128" fill="none"><path d="M34 50 L64 76 L94 50" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 50 V82 a4 4 0 0 0 4 4 H90 a4 4 0 0 0 4 -4 V50" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/></svg>
    </div>
    <div style="color:#475569;font-size:14px;font-weight:600">Mail Pro Company</div>
    <div style="width:26px;height:26px;border:3px solid #ffe8d4;border-top-color:#f97316;border-radius:50%;animation:mpcspin .8s linear infinite"></div>
    <style>@keyframes mpcspin{to{transform:rotate(360deg)}}</style>
  </div>

<div class="h-full flex flex-col max-w-2xl mx-auto">

  <!-- En-tête -->
  <header class="h-16 shrink-0 flex items-center justify-between px-4 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
    <a href="index.html" class="flex items-center gap-2.5">
      <svg width="34" height="34" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="g" x1="16" y1="20" x2="112" y2="108" gradientUnits="userSpaceOnUse"><stop stop-color="#ff8a3d"/><stop offset="1" stop-color="#ea580c"/></linearGradient></defs>
        <rect x="16" y="24" width="96" height="80" rx="22" fill="url(#g)"/>
        <path d="M34 50 L64 76 L94 50" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M34 50 V82 a4 4 0 0 0 4 4 H90 a4 4 0 0 0 4 -4 V50" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
      </svg>
      <div class="leading-tight"><div class="text-[11px] uppercase tracking-widest text-slate-400">Messagerie</div><div class="font-black">Mail Pro Company</div></div>
    </a>
    <a href="inscription.html" id="authLink" class="text-sm font-medium text-slate-500 hover:text-orange-500"></a>
  </header>

  <!-- Agent -->
  <div class="shrink-0 flex items-center gap-3 px-4 py-3 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
    <span class="relative w-10 h-10 rounded-full bg-orange-100 dark:bg-orange-500/20 grid place-items-center text-orange-600 dark:text-orange-400 font-black">A
      <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-green-500 border-2 border-white dark:border-slate-900"></span>
    </span>
    <div><div class="font-semibold text-sm">Agent Mail Pro</div><div class="text-xs text-green-600 dark:text-green-400">En ligne · répond automatiquement</div></div>
  </div>

  <!-- Fil des messages -->
  <main id="thread" class="flex-1 overflow-y-auto px-4 py-5 space-y-3"></main>

  <!-- Zone bloquée si non connecté -->
  <div id="guard" class="hidden shrink-0 p-4 text-center border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
    <p class="text-sm text-slate-500">Connectez-vous pour discuter avec l'agent.</p>
    <a href="inscription.html" class="inline-block mt-2 px-5 py-2.5 rounded-xl bg-orange-500 text-white text-sm font-semibold hover:bg-orange-600">Se connecter / s'inscrire</a>
  </div>

  <!-- Saisie -->
  <form id="sendForm" class="hidden shrink-0 flex items-center gap-2 p-3 border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
    <input id="msgInput" type="text" required autocomplete="off" placeholder="Écrivez un message…" class="flex-1 px-4 py-3 rounded-full border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400" />
    <button type="submit" class="w-11 h-11 shrink-0 rounded-full bg-orange-500 hover:bg-orange-600 text-white grid place-items-center" aria-label="Envoyer">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
</div>

<script>
  const SUPABASE_URL = 'https://bojmdozjhxljhherjbfg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_FsTiAajd2UPW2kLmO49Peg_t16vGU7a';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = (id) => document.getElementById(id);
  const thread = $('thread');
  let me = null;

  function bubble(role, body) {
    const wrap = document.createElement('div');
    wrap.className = 'flex ' + (role === 'user' ? 'justify-end' : 'justify-start');
    const b = document.createElement('div');
    b.className = (role === 'user'
      ? 'bg-orange-500 text-white rounded-2xl rounded-br-md'
      : 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl rounded-bl-md')
      + ' max-w-[78%] px-4 py-2.5 text-sm shadow-sm whitespace-pre-wrap break-words';
    b.textContent = body;
    wrap.appendChild(b); thread.appendChild(wrap);
    thread.scrollTop = thread.scrollHeight;
  }

  async function init() {
    const { data } = await sb.auth.getUser();
    if (!data || !data.user) {
      $('guard').classList.remove('hidden');
      $('authLink').textContent = 'Connexion';
      return;
    }
    me = data.user;
    $('sendForm').classList.remove('hidden');
    $('authLink').textContent = 'Déconnexion';
    $('authLink').href = '#';
    $('authLink').onclick = async (e) => { e.preventDefault(); await sb.auth.signOut(); location.href = 'inscription.html'; };

    // Historique
    const { data: msgs } = await sb.from('messages').select('*').order('created_at', { ascending: true });
    if (!msgs || msgs.length === 0) {
      bubble('agent', "Bonjour 👋 Je suis l'agent Mail Pro Company. Posez-moi une question (prix, stockage, sécurité…) et je vous réponds tout de suite.");
    } else {
      msgs.forEach(m => bubble(m.role, m.body));
    }

    // Temps réel : nouveaux messages (les miens + réponses de l'agent)
    sb.channel('messages-' + me.id)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'user_id=eq.' + me.id },
          (payload) => bubble(payload.new.role, payload.new.body))
      .subscribe();
  }

  $('sendForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = $('msgInput').value.trim();
    if (!text || !me) return;
    $('msgInput').value = '';
    const { error } = await sb.from('messages').insert({ user_id: me.id, role: 'user', body: text });
    if (error) { bubble('agent', "Erreur d'envoi : " + error.message); }
  });

  init();
</script>
  <script>
    (function(){var b=document.getElementById('boot');if(!b)return;function hide(){b.style.transition='opacity .3s';b.style.opacity='0';setTimeout(function(){b.remove();},300);}window.addEventListener('load',function(){setTimeout(hide,150);});setTimeout(hide,9000);})();
  </script>
</body>
</html>
